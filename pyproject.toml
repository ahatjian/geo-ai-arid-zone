[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]
markers = [
    "slow: marks tests as slow",
    "network: marks tests requiring network access",
]

# ============================================
# Ruff — 渐进式规则集
# ============================================
# 采用渐进策略: 先只启用"零误报、只抓真实错误"的规则, 保证 CI
# 从第一天起就是绿的, 再分批收紧。
#
# 这条规则集不是形式主义 —— F82 (未定义名) 上线前就抓出过
# pages/5_变化检测.py 里"模块级调用了一个 500 行之后才定义的函数",
# 该分支一旦执行必然 NameError。
#
# 收紧路径 (违规数为 2026-09-13 实测):
#   当前: E9 + F7 + F82 + W6          违规 0
#   下一步: 并入 E4 / E7              约 74 处 (导入位置、单行多语句)
#   再下一步: 并入 F401 未使用导入      约 498 处 (需单独一轮清理)
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E9",   # 语法错误 / 运行时错误 (如 SyntaxError, 重复参数)
    "F7",   # 语法类 (如 break/continue 位置错误)
    "F82",  # 未定义名 (F821) / 重定义 (F811) —— 真实 bug 信号
    "W6",   # 已废弃用法
]
